services:
  backend:
    build:
      context: ./backend
    container_name: redis-fastapi
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - redis
      - mongo

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "127.0.0.1:6379:6379"

  mongo:
    image: mongo:7
    container_name: mongo-server
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: